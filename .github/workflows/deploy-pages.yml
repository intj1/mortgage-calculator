name: Deploy front end to GitHub Pages

# Builds the Angular app and publishes it to GitHub Pages. On Pages there is no
# Rust backend, so the SPA runs entirely on its in-browser fallback engine.
on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deployment; newer pushes cancel in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The site runs the real Rust engine in the browser: build the crate to
      # WebAssembly and ship it as a static asset the SPA loads at runtime.
      - name: Build Rust engine to WebAssembly
        working-directory: ${{ github.workspace }}
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --lib --release --target wasm32-unknown-unknown
          cp target/wasm32-unknown-unknown/release/mortgage_calculator.wasm frontend/public/engine.wasm

      - name: Install dependencies
        run: npm ci

      - name: Build (base-href scoped to the repo path)
        run: npx ng build --configuration production --base-href /mortgage-calculator/

      - name: Disable Jekyll processing
        run: touch dist/frontend/browser/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        # Auto-enable Pages (build type: GitHub Actions) on first run so the
        # deploy doesn't require enabling it manually in repo settings first.
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
