[package]
name = "mortgage_calculator"
version = "0.3.0"
edition = "2021"
description = "A mortgage amortization engine with a CLI, a REST API, and a WebAssembly build"

[lib]
name = "mortgage_calculator"
path = "src/lib.rs"
# cdylib is what the wasm32 target links into engine.wasm; rlib keeps the
# library usable by the native binaries.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mortgage-calc"
path = "src/main.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

# Universal dependencies — must compile for wasm32-unknown-unknown too.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native-only dependencies (CLI + server + terminal report). These do not
# build on wasm32, so they are gated to non-wasm targets.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tabled = "0.17"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.6", features = ["cors"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
# Small wasm payloads; also fine for the native binaries.
opt-level = "z"
lto = true
strip = true
